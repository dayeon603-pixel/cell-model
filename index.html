<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A eukaryotic animal cell sculpted in Blender and rendered in the browser: eight organelles, cut away.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔬</text></svg>">
<style>:root{color-scheme:light dark}html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Cytology Plate One — Sculpt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F5F7; --ink:#12161C; --ink-2:#4E5866; --ink-3:#7C8794;
  --panel:rgba(255,255,255,.90); --edge:rgba(16,20,26,.14); --shadow:0 8px 30px rgba(20,28,44,.12);
  --nucleus:#5B4A7E; --er:#7A5468; --golgi:#9A6428; --mito:#42604F; --lyso:#8C3A36; --membrane:#4E6076;
  --f-d:"Zilla Slab",Georgia,serif; --f-b:"Source Sans 3",system-ui,sans-serif; --f-m:"IBM Plex Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0E13; --ink:#E9ECF1; --ink-2:#9AA5B3; --ink-3:#6C7686;
  --panel:rgba(14,18,26,.86); --edge:rgba(233,236,241,.16); --shadow:0 8px 34px rgba(0,0,0,.6);
  --nucleus:#A492D8; --er:#C89AB0; --golgi:#DCA45C; --mito:#7FB894; --lyso:#D98079;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);overflow:hidden}
.app{position:relative;width:100%;height:100vh;min-height:560px}
canvas{display:block;width:100%;height:100%;cursor:grab}canvas:active{cursor:grabbing}
.title{position:absolute;top:24px;left:28px;pointer-events:none}
.title h1{margin:0;font-family:var(--f-d);font-size:21px;font-weight:700}
.title .s{margin-top:4px;font-family:var(--f-m);font-size:10px;letter-spacing:.11em;color:var(--ink-3)}
.rail{position:absolute;top:24px;right:24px;width:230px;background:var(--panel);backdrop-filter:blur(10px);
  border:1px solid var(--edge);box-shadow:var(--shadow);border-radius:3px;padding:10px}
.rail .h{font-family:var(--f-m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:2px 4px 7px}
.kb{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:9px;width:100%;background:none;border:0;
  border-left:2px solid transparent;padding:6px;font:inherit;font-size:13px;color:var(--ink);text-align:left;cursor:pointer;border-radius:2px}
.kb:hover{background:var(--edge)}
.kb .d{width:9px;height:9px;border-radius:50%;background:var(--c)}
.kb[aria-current="true"]{background:var(--bg);border-left-color:var(--c);font-weight:600}
.card{position:absolute;left:28px;bottom:26px;width:340px;max-width:calc(100% - 56px);background:var(--panel);
  backdrop-filter:blur(10px);border:1px solid var(--edge);border-left:3px solid var(--c,var(--ink));
  box-shadow:var(--shadow);border-radius:3px;padding:14px 16px;opacity:0;transition:opacity .22s}
.card.on{opacity:1}
.card h2{margin:0;font-family:var(--f-d);font-size:18px;font-weight:600}
.card .sub{font-family:var(--f-m);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.card p{margin:8px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;margin:9px 0 0;font-family:var(--f-m);font-size:10.5px}
.card dt{color:var(--ink-3);text-transform:uppercase;font-size:9.5px;letter-spacing:.06em}
.card dd{margin:0;color:var(--ink-2)}
.dock{position:absolute;left:28px;top:78px;display:flex;flex-direction:column;gap:5px}
.btn{font-family:var(--f-m);font-size:10px;letter-spacing:.09em;text-transform:uppercase;background:var(--panel);
  border:1px solid var(--edge);color:var(--ink-2);padding:7px 11px;border-radius:2px;cursor:pointer}
.btn:hover{color:var(--ink)}
.boot{position:absolute;inset:0;display:grid;place-content:center;background:var(--bg);color:var(--ink-3);
  font-family:var(--f-m);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;transition:opacity .5s}
.boot.gone{opacity:0;pointer-events:none}
</style>

<div class="app" id="app">
  <canvas id="cv"></canvas>
  <div class="title"><h1>Cytology Plate One</h1><div class="s">SCULPTED IN BLENDER · CYCLES · ø 20 µm</div></div>
  <div class="dock">
    <button class="btn" id="bSpin" aria-pressed="true" type="button">Rotation</button>
    <button class="btn" id="bReset" type="button">Reset view</button>
    <a class="btn" href="live.html" style="text-decoration:none;display:block">Live version →</a>
  </div>
  <div class="rail" id="rail"><div class="h">Key to structures</div></div>
  <div class="card" id="card"></div>
  <div class="boot" id="boot">Loading sculpt…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
(function(){
"use strict";
var ORG=[
 {k:"plasma_membrane",n:"Plasma membrane",s:"Phospholipid bilayer",c:"#6E8296",
  t:"A double layer of phospholipids ~7 nm thick. Channels admit chosen ions, pumps spend ATP to push them back, receptors read outside signals without letting them in.",
  d:[["Thickness","7–8 nm"],["ATP cost","20–30% at rest"]]},
 {k:"chromatin",n:"Nucleus",s:"Chromatin, envelope, nucleolus",c:"#8C6AE0",
  t:"Two metres of DNA packed into a 6 µm sphere behind a double membrane pierced by thousands of pores. Transcription happens here; only finished mRNA is exported.",
  d:[["Diameter","5–10 µm"],["DNA","≈2 m"],["Pores","2,000–4,000"]]},
 {k:"rough_ER",n:"Rough ER",s:"Ribosome-studded cisternae",c:"#C88AA4",
  t:"Flattened sacs continuous with the nuclear envelope. New proteins thread through the membrane as they are built, are folded by chaperones, and anything misfolded is destroyed.",
  d:[["Membrane","≈50% of cell"],["Traffic","≈1/3 of proteins"]]},
 {k:"ribosomes",n:"Ribosomes",s:"Free and bound",c:"#7A6A55",
  t:"Reads mRNA three bases at a time, forging one peptide bond per codon at 15–20 amino acids a second. The catalytic site is RNA, not protein.",
  d:[["Size","25–30 nm"],["Count","≈10 million"]]},
 {k:"golgi",n:"Golgi apparatus",s:"Cis-to-trans stack",c:"#C8873C",
  t:"Cargo enters the cis face, moves through the stack while its sugar chains are rebuilt, and leaves the trans face sorted by destination via a mannose-6-phosphate tag.",
  d:[["Cisternae","4–8"],["Found","Golgi, 1898"]]},
 {k:"mito",n:"Mitochondrion",s:"Oxidative phosphorylation",c:"#5E9A74",
  t:"Pumps protons across the folded inner membrane; they return only through ATP synthase, a turbine that spins as they pass — about 30 ATP per glucose. Keeps its own circular DNA.",
  d:[["Length","1–4 µm"],["Per liver cell","1,000–2,000"]]},
 {k:"lysosome",n:"Lysosome",s:"Acidic compartment",c:"#B4514C",
  t:"Around 60 enzymes that work only in acid, with pumps holding the interior at pH 4.5. Worn-out organelles and swallowed bacteria are delivered here and dismantled.",
  d:[["Diameter","0.1–1.2 µm"],["Interior","pH 4.5–5.0"]]},
 {k:"vesicle",n:"Transport vesicles",s:"Membrane traffic",c:"#5E7488",
  t:"Membrane spheres ferrying cargo between compartments — ER to Golgi, Golgi to the surface or to a lysosome. Each carries an address that decides where it may fuse.",
  d:[["Diameter","50–100 nm"],["Coat","COPI / COPII / clathrin"]]}
];

var app=document.getElementById("app"),canvas=document.getElementById("cv");
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.NoToneMapping;
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(40,1.6,0.1,500);

function env(){
  var c=document.createElement("canvas");c.width=512;c.height=256;var g=c.getContext("2d");
  var gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,"#ffffff");gr.addColorStop(.5,"#dfe5ec");gr.addColorStop(1,"#9aa4b2");
  g.fillStyle=gr;g.fillRect(0,0,512,256);
  var rg=g.createRadialGradient(150,50,0,150,50,130);
  rg.addColorStop(0,"rgba(255,255,255,.95)");rg.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle=rg;g.beginPath();g.arc(150,50,130,0,6.28);g.fill();
  var t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;
  var p=new THREE.PMREMGenerator(renderer);p.compileEquirectangularShader();
  var e=p.fromEquirectangular(t).texture;p.dispose();t.dispose();return e;
}
scene.environment=env();
var key=new THREE.DirectionalLight(0xffffff,1.5);key.position.set(16,22,14);scene.add(key);
scene.add(new THREE.DirectionalLight(0xbdd3f2,.5).translateX(-18));
scene.add(new THREE.AmbientLight(0xffffff,.42));

function isDark(){var a=document.documentElement.getAttribute("data-theme");
  if(a==="dark")return true;if(a==="light")return false;
  return matchMedia("(prefers-color-scheme: dark)").matches;}
function paintBg(){renderer.setClearColor(new THREE.Color(isDark()?0x0B0E13:0xF3F5F7),1);}
paintBg();matchMedia("(prefers-color-scheme: dark)").addEventListener("change",paintBg);

var picks=[],byKey={},root=null;
function keyFor(name){
  name=name.toLowerCase();
  if(name.indexOf("plasma")>=0)return "plasma_membrane";
  if(name.indexOf("chromatin")>=0||name.indexOf("envelope")>=0||name.indexOf("nucleol")>=0||name.indexOf("pore")>=0||name.indexOf("torus")>=0)return "chromatin";
  if(name.indexOf("rough_er")>=0)return "rough_ER";
  if(name.indexOf("ribosome")>=0)return "ribosomes";
  if(name.indexOf("golgi")>=0)return "golgi";
  if(name.indexOf("mito")>=0)return "mito";
  if(name.indexOf("lyso")>=0)return "lysosome";
  if(name.indexOf("vesicle")>=0)return "vesicle";
  return null;
}
new THREE.GLTFLoader().load("cell.glb",function(gltf){
  root=gltf.scene;
  var box=new THREE.Box3().setFromObject(root),ctr=box.getCenter(new THREE.Vector3());
  root.position.sub(ctr);
  root.traverse(function(o){
    if(!o.isMesh)return;
    o.castShadow=o.receiveShadow=false;
    var k=keyFor(o.name);
    if(k){o.userData.key=k;picks.push(o);(byKey[k]=byKey[k]||[]).push(o);}
    if(o.material){o.material.side=THREE.DoubleSide;o.material.envMapIntensity=.55;}
  });
  scene.add(root);
  var sph=new THREE.Box3().setFromObject(root).getBoundingSphere(new THREE.Sphere());
  var fit=sph.radius/Math.sin(camera.fov*Math.PI/360)*0.72;
  goal.r=fit; cam.r=fit*1.25;
  document.getElementById("boot").classList.add("gone");
},undefined,function(){document.getElementById("boot").textContent="Could not load cell.glb";});

var cam={th:0.86,ph:1.16,r:34,t:new THREE.Vector3()},goal={th:0.86,ph:1.16,r:27},spin=true;
function place(){cam.ph=Math.max(.15,Math.min(Math.PI-.15,cam.ph));
  camera.position.set(cam.r*Math.sin(cam.ph)*Math.cos(cam.th),cam.r*Math.cos(cam.ph),cam.r*Math.sin(cam.ph)*Math.sin(cam.th));
  camera.lookAt(cam.t);}
var drag=null;
canvas.addEventListener("pointerdown",function(e){drag={x:e.clientX,y:e.clientY,m:0};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener("pointermove",function(e){if(!drag)return;
  var dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.m+=Math.abs(dx)+Math.abs(dy);
  goal.th-=dx*.006;goal.ph-=dy*.006;cam.th-=dx*.006;cam.ph-=dy*.006;
  goal.ph=Math.max(.15,Math.min(Math.PI-.15,goal.ph));drag.x=e.clientX;drag.y=e.clientY;spin=false;
  document.getElementById("bSpin").setAttribute("aria-pressed","false");});
canvas.addEventListener("pointerup",function(e){if(drag&&drag.m<6)click(e);drag=null;});
canvas.addEventListener("wheel",function(e){e.preventDefault();
  goal.r=Math.max(6,Math.min(70,goal.r*(1+Math.sign(e.deltaY)*.09)));},{passive:false});

var ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),card=document.getElementById("card");
function click(e){
  var r=canvas.getBoundingClientRect();
  ndc.x=((e.clientX-r.left)/r.width)*2-1;ndc.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ndc,camera);
  var h=ray.intersectObjects(picks,false);
  if(h.length)select(h[0].object.userData.key);
}
function org(k){for(var i=0;i<ORG.length;i++)if(ORG[i].k===k)return ORG[i];return null;}
function select(k){
  var o=org(k);if(!o)return;
  card.style.setProperty("--c",o.c);
  var d="";for(var i=0;i<o.d.length;i++)d+="<dt>"+o.d[i][0]+"</dt><dd>"+o.d[i][1]+"</dd>";
  card.innerHTML="<h2>"+o.n+"</h2><div class='sub'>"+o.s+"</div><p>"+o.t+"</p><dl>"+d+"</dl>";
  card.classList.add("on");
  var b=rail.querySelectorAll(".kb");
  for(i=0;i<b.length;i++)b[i].setAttribute("aria-current",b[i].dataset.k===k?"true":"false");
}
var rail=document.getElementById("rail");
ORG.forEach(function(o){
  var b=document.createElement("button");b.className="kb";b.type="button";b.dataset.k=o.k;
  b.style.setProperty("--c",o.c);b.innerHTML="<span class='d'></span><span>"+o.n+"</span>";
  rail.appendChild(b);
});
rail.addEventListener("click",function(e){var b=e.target.closest(".kb");if(b)select(b.dataset.k);});
document.getElementById("bSpin").addEventListener("click",function(){
  spin=!spin;this.setAttribute("aria-pressed",spin?"true":"false");});
document.getElementById("bReset").addEventListener("click",function(){
  goal.th=0.86;goal.ph=1.16;goal.r=27;card.classList.remove("on");
  var b=rail.querySelectorAll(".kb");for(var i=0;i<b.length;i++)b[i].setAttribute("aria-current","false");});

function resize(){var w=app.clientWidth,h=app.clientHeight;if(!w||!h)return;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener("resize",resize);resize();

var prev=performance.now();
(function tick(now){requestAnimationFrame(tick);
  var dt=Math.min(now-prev,64);prev=now;
  if(spin&&!drag)goal.th+=dt*0.00007;
  var e=1-Math.pow(0.0025,dt/1000);
  cam.th+=(goal.th-cam.th)*e;cam.ph+=(goal.ph-cam.ph)*e;cam.r+=(goal.r-cam.r)*e;
  place();renderer.render(scene,camera);
})(prev);
})();
</script>

</body>
</html>
