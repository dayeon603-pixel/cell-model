<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cytology Plate One</title>
<meta name="description" content="Plate I — Eukaryotic animal cell. Eight structures, marked by dots; select one to read it.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128300;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --paper:#FFFFFF; --plate:#FFFFFF; --figure-bg:#FFFFFF;
  --ink:#15171B; --ink-2:#4F545C; --ink-3:#8B9099;
  --rule-mid:#DAD8D3; --rule-fine:#EFEEEA;
  --f-s:"Spectral", Georgia, "Times New Roman", serif;
  --f-m:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-s);font-size:16px;
  -webkit-font-smoothing:antialiased;overflow:hidden}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px;border-radius:999px}

.plate{height:100vh;display:flex;flex-direction:column;padding:22px 26px 18px;max-width:1500px;margin:0 auto}

.head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:0 6px 12px}
.head .l .no{font-family:var(--f-m);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3)}
.head .l h1{margin:2px 0 0;font-weight:500;font-size:clamp(19px,2.4vw,26px);line-height:1.05}
.head .r{font-family:var(--f-m);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);text-align:right;line-height:1.85}

.figure{position:relative;flex:1;min-height:0;border-radius:30px;overflow:hidden;
  background:
    radial-gradient(120% 85% at 50% -10%, #FFFFFF 0%, #F7F9FC 45%, #EDF1F6 100%);
  border:1px solid rgba(21,23,27,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 1px 3px rgba(20,25,40,.05)}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}

/* ── the dots: the whole legend, folded down ── */
#dots{position:absolute;inset:0;pointer-events:none}
.dot{position:absolute;transform:translate(-50%,-50%);width:15px;height:15px;border-radius:50%;
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 32%, rgba(255,255,255,0) 58%),
    var(--c);
  border:1.5px solid rgba(255,255,255,.85);
  box-shadow:0 2px 7px rgba(15,20,30,.26), inset 0 -2px 4px rgba(0,0,0,.16);
  padding:0;cursor:pointer;pointer-events:auto;opacity:0;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  transition:opacity .25s ease, transform .18s cubic-bezier(.2,.9,.25,1), box-shadow .18s ease}
.dot.on{opacity:1}
.dot:hover{transform:translate(-50%,-50%) scale(1.5);box-shadow:0 2px 9px rgba(15,20,30,.34)}
.dot.sel{transform:translate(-50%,-50%) scale(1.7);
  box-shadow:0 0 0 7px rgba(255,255,255,.42),0 0 0 8.5px rgba(21,23,27,.10),0 3px 11px rgba(15,20,30,.30), inset 0 -2px 4px rgba(0,0,0,.16)}

/* ── the card, only on demand ── */
.pop{position:absolute;width:302px;max-width:calc(100% - 36px);overflow:hidden;
  background:linear-gradient(150deg, rgba(255,255,255,.62), rgba(255,255,255,.38) 42%, rgba(255,255,255,.50));
  -webkit-backdrop-filter:blur(26px) saturate(185%);
  backdrop-filter:blur(26px) saturate(185%);
  border:1px solid rgba(255,255,255,.72);border-radius:30px;padding:19px 21px 20px;
  box-shadow:
    0 18px 50px rgba(18,24,38,.17),
    0 2px 10px rgba(18,24,38,.06),
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(255,255,255,.42),
    inset 0 0 34px rgba(255,255,255,.30);
  opacity:0;pointer-events:none;
  transition:opacity .2s ease, transform .22s cubic-bezier(.2,.9,.25,1);
  transform:translateY(7px) scale(.985);z-index:5}
.pop::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(158deg, rgba(255,255,255,.75) 0%, rgba(255,255,255,.10) 34%, rgba(255,255,255,0) 62%)}
.pop::after{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.98), transparent)}
.pop > *{position:relative;z-index:1}
.pop.on{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.pop .sw{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;
  vertical-align:middle;margin-right:8px}
.pop h2{margin:0;display:inline;font-weight:600;font-size:18px;line-height:1.2;vertical-align:middle}
.pop .lat{font-style:italic;font-weight:300;font-size:12.5px;color:var(--ink-3);margin-top:5px}
.pop p{margin:10px 0 0;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.pop dl{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:2px 12px;margin:12px 0 0;
  font-family:var(--f-m);font-size:10px}
.pop dt{color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-size:9.5px}
.pop dd{margin:0;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pop .x{position:absolute;top:13px;right:13px;width:27px;height:27px;border-radius:50%;
  border:1px solid rgba(255,255,255,.8);color:var(--ink-3);cursor:pointer;z-index:2;
  background:linear-gradient(150deg, rgba(255,255,255,.8), rgba(255,255,255,.45));
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 2px 8px rgba(18,24,38,.10), inset 0 1px 0 rgba(255,255,255,.95);
  font-family:var(--f-m);font-size:12px;line-height:1;display:grid;place-content:center;padding:0}
.pop .x:hover{color:var(--ink)}

.tools{position:absolute;right:18px;top:18px;display:flex;flex-direction:column;gap:6px}
.tool{font-family:var(--f-m);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  background:linear-gradient(150deg, rgba(255,255,255,.72), rgba(255,255,255,.42));
  -webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
  border:1px solid rgba(255,255,255,.75);color:var(--ink-2);
  padding:8px 15px;border-radius:999px;cursor:pointer;text-decoration:none;display:block;text-align:center;
  box-shadow:0 4px 14px rgba(18,24,38,.10), inset 0 1px 0 rgba(255,255,255,.95);
  transition:color .15s ease, box-shadow .18s ease, transform .18s ease}
.tool:active{transform:scale(.97)}
.tool:hover{color:var(--ink);box-shadow:0 6px 20px rgba(18,24,38,.14), inset 0 1px 0 rgba(255,255,255,1)}

.hint{position:absolute;left:24px;top:20px;font-family:var(--f-m);font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);pointer-events:none;transition:opacity .4s}
.hint.gone{opacity:0}

.scale{position:absolute;left:24px;bottom:20px;pointer-events:none;font-family:var(--f-m);
  font-size:9.5px;letter-spacing:.1em;color:var(--ink-3)}
.scale .bar{height:2px;border-radius:2px;background:var(--ink-3);margin-bottom:5px}

.foot{padding:11px 8px 0;display:flex;justify-content:space-between;gap:18px;
  font-family:var(--f-m);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
@media (max-width:700px){.foot .r2{display:none}.plate{padding:16px 14px 12px}.figure{border-radius:22px}}

.boot{position:absolute;inset:0;display:grid;place-content:center;background:transparent;
  color:var(--ink-3);font-family:var(--f-m);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  transition:opacity .5s}
.boot.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="plate">
  <header class="head">
    <div class="l">
      <div class="no">Plate I</div>
      <h1>Eukaryotic Animal Cell</h1>
    </div>
    <div class="r">Composite reconstruction<br>Diameter &#8776; 20 &#181;m &#183; 8 structures</div>
  </header>

  <figure class="figure" id="figure">
    <canvas id="cv" aria-label="Three-dimensional animal cell. Eight structures are marked by dots; select one to read it."></canvas>
    <div id="dots"></div>
    <div class="pop" id="pop"></div>
    <div class="hint" id="hint">Select a dot</div>
    <div class="scale"><div class="bar" id="sbar" style="width:80px"></div><span id="sbarL">5 &#181;m</span></div>
    <div class="tools">
      <button class="tool" id="bSpin" type="button" aria-pressed="true">Rotate</button>
      <button class="tool" id="bReset" type="button">Reset</button>
      <a class="tool" href="live.html">Animated</a>
    </div>
    <div class="boot" id="boot">Loading&#8230;</div>
  </figure>

  <footer class="foot">
    <span>Fig. 1 &#183; Sagittal cutaway &#183; counts reduced for legibility</span>
    <span class="r2">Blender 5.0 &#183; Cycles &#183; WebGL &#183; Dayeon Kang</span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script>
(function(){
"use strict";

var ORG=[
 {k:"plasma_membrane",n:"Plasma membrane",lat:"Membrana plasmatica",c:"#6E8296",
  t:"A double layer of phospholipids whose water-hating tails face inward, making the membrane an automatic barrier to ions and polar molecules. Channels admit chosen ions down a gradient, pumps spend ATP to drive them back, and receptors read signals from outside without admitting the signal itself.",
  d:[["Thickness","7–8 nm"],["Composition","≈50% lipid / 50% protein"],["Model","Singer & Nicolson, 1972"]]},
 {k:"chromatin",n:"Nucleus",lat:"Nucleus, cum nucleolo",c:"#8C6AE0",
  t:"Holds roughly two metres of DNA as chromatin within a double membrane pierced by thousands of pore complexes. Transcription and RNA editing occur here and only finished messenger RNA is exported; the dense nucleolus assembles ribosomal subunits.",
  d:[["Diameter","5–10 µm"],["DNA length","≈2 m per diploid cell"],["Nuclear pores","2,000–4,000"],["Described","Robert Brown, 1831"]]},
 {k:"rough_ER",n:"Rough endoplasmic reticulum",lat:"Reticulum endoplasmicum granulosum",c:"#C88AA4",
  t:"Flattened cisternae continuous with the outer nuclear envelope. Nascent polypeptides are threaded through the membrane as they are built, folded by chaperones and glycosylated within the lumen; anything that fails to fold correctly is retrieved and destroyed.",
  d:[["Membrane share","≈50% of cell total"],["Protein traffic","≈1/3 of the proteome"],["Described","Porter, Claude & Fullam, 1945"]]},
 {k:"ribosomes",n:"Ribosomes",lat:"Ribosomata",c:"#7A6A55",
  t:"Reads messenger RNA three bases at a time, accepting the matching transfer RNA and forging one peptide bond per codon at 15–20 amino acids per second. The catalytic centre is built from RNA rather than protein.",
  d:[["Diameter","25–30 nm"],["Count per cell","≈10 million"],["Eukaryotic form","80S (60S + 40S)"],["Discovered","George Palade, 1955"]]},
 {k:"golgi",n:"Golgi apparatus",lat:"Apparatus golgiensis",c:"#C8873C",
  t:"A polarised stack of cisternae. Cargo enters at the cis face, is progressively reworked as its sugar chains are trimmed and rebuilt, and departs the trans face sorted by destination — lysosomal enzymes carrying a mannose-6-phosphate tag that acts as the address.",
  d:[["Cisternae per stack","4–8"],["Stack width","1–2 µm"],["Discovered","Camillo Golgi, 1898"]]},
 {k:"mito",n:"Mitochondrion",lat:"Mitochondrion",c:"#5E9A74",
  t:"Electrons stripped from food descend a chain of complexes in the folded inner membrane, pumping protons outward. The protons return only through ATP synthase, a rotary turbine yielding some thirty molecules of ATP per glucose. Retains its own circular genome and 70S ribosomes.",
  d:[["Length","1–4 µm"],["Width","0.5–1 µm"],["Count (liver cell)","1,000–2,000"],["Named","Carl Benda, 1898"]]},
 {k:"lysosome",n:"Lysosome",lat:"Lysosoma",c:"#B4514C",
  t:"Contains some sixty acid hydrolases held at pH 4.5 by membrane proton pumps. Exhausted organelles and engulfed bacteria are delivered here and dismantled; the acid dependence is itself the safety interlock, since rupture into neutral cytosol inactivates the enzymes.",
  d:[["Diameter","0.1–1.2 µm"],["Interior pH","4.5–5.0"],["Enzymes","≈60 acid hydrolases"],["Discovered","Christian de Duve, 1955"]]},
 {k:"vesicle",n:"Transport vesicles",lat:"Vesiculae transportatoriae",c:"#5E7488",
  t:"Membrane-bounded spheres carrying cargo between compartments — endoplasmic reticulum to Golgi, Golgi to the cell surface or to a lysosome. Each bears a coat and an address that determines where it is permitted to fuse.",
  d:[["Diameter","50–100 nm"],["Coats","COPI · COPII · clathrin"]]}
];

var figure=document.getElementById("figure"), canvas=document.getElementById("cv");
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
renderer.setClearAlpha(0);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.NoToneMapping;
var scene=new THREE.Scene();
scene.background=null;
var camera=new THREE.PerspectiveCamera(40,1.6,0.1,600);

function buildEnv(){
  var c=document.createElement("canvas");c.width=512;c.height=256;var g=c.getContext("2d");
  var gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,"#ffffff");gr.addColorStop(.5,"#dfe4eb");gr.addColorStop(1,"#8d97a6");
  g.fillStyle=gr;g.fillRect(0,0,512,256);
  var rg=g.createRadialGradient(150,50,0,150,50,135);
  rg.addColorStop(0,"rgba(255,255,255,.95)");rg.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle=rg;g.beginPath();g.arc(150,50,135,0,6.283);g.fill();
  var t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;
  var p=new THREE.PMREMGenerator(renderer);p.compileEquirectangularShader();
  var e=p.fromEquirectangular(t).texture;p.dispose();t.dispose();return e;
}
scene.environment=buildEnv();
var key=new THREE.DirectionalLight(0xffffff,1.55);key.position.set(16,22,14);scene.add(key);
var fill=new THREE.DirectionalLight(0xc4d6ef,.38);fill.position.set(-18,-6,-12);scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff,.24));

var picks=[], anchors={}, loaded=false;
function keyFor(name){
  name=(name||"").toLowerCase();
  if(name.indexOf("plasma")>=0)return "plasma_membrane";
  if(name.indexOf("chromatin")>=0||name.indexOf("envelope")>=0||name.indexOf("nucleol")>=0||name.indexOf("torus")>=0)return "chromatin";
  if(name.indexOf("rough_er")>=0)return "rough_ER";
  if(name.indexOf("ribosome")>=0)return "ribosomes";
  if(name.indexOf("golgi")>=0)return "golgi";
  if(name.indexOf("mito")>=0)return "mito";
  if(name.indexOf("lyso")>=0)return "lysosome";
  if(name.indexOf("vesicle")>=0)return "vesicle";
  return null;
}
if(!THREE.GLTFLoader){ document.getElementById("boot").textContent="GLTFLoader unavailable"; }
else new THREE.GLTFLoader().load("cell.glb",function(gltf){
  var root=gltf.scene;
  root.position.sub(new THREE.Box3().setFromObject(root).getCenter(new THREE.Vector3()));
  var boxes={};
  root.traverse(function(o){
    if(!o.isMesh)return;
    var m=o.material;
    if(m){
      m.side=THREE.DoubleSide; m.envMapIntensity=.34;
      if(m.color && !m.userData.__tuned){
        var hsl={h:0,s:0,l:0}; m.color.getHSL(hsl);
        m.color.setHSL(hsl.h, Math.min(1,hsl.s*1.45), Math.max(.05,Math.min(.92,hsl.l*0.90)));
        m.userData.__tuned=true;
      }
      if(m.roughness!==undefined) m.roughness=Math.min(1,m.roughness*0.85);
    }
    var k=keyFor(o.name); if(!k)return;
    o.userData.key=k; picks.push(o);
    o.updateWorldMatrix(true,false);
    var b=new THREE.Box3().setFromObject(o);
    boxes[k]=boxes[k]?boxes[k].union(b):b;
  });
  scene.add(root);
  Object.keys(boxes).forEach(function(k){ anchors[k]=boxes[k].getCenter(new THREE.Vector3()); });
  if(anchors["plasma_membrane"]) anchors["plasma_membrane"].set(-8.4,-2.0,-3.0);
  var sph=new THREE.Box3().setFromObject(root).getBoundingSphere(new THREE.Sphere());
  var fit=sph.radius/Math.sin(camera.fov*Math.PI/360)*0.56;
  goal.r=fit; cam.r=fit*1.22;
  loaded=true;
  document.getElementById("boot").classList.add("gone");
},undefined,function(){document.getElementById("boot").textContent="cell.glb failed to load";});

var cam={th:0.86,ph:1.16,r:34,t:new THREE.Vector3()}, goal={th:0.86,ph:1.16,r:27}, spin=true;
function place(){
  cam.ph=Math.max(.12,Math.min(Math.PI-.12,cam.ph));
  camera.position.set(cam.r*Math.sin(cam.ph)*Math.cos(cam.th),cam.r*Math.cos(cam.ph),cam.r*Math.sin(cam.ph)*Math.sin(cam.th));
  camera.lookAt(cam.t);
}
var drag=null;
canvas.addEventListener("pointerdown",function(e){drag={x:e.clientX,y:e.clientY,m:0};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener("pointermove",function(e){
  if(!drag)return;
  var dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.m+=Math.abs(dx)+Math.abs(dy);
  goal.th-=dx*.006;goal.ph-=dy*.006;cam.th-=dx*.006;cam.ph-=dy*.006;
  goal.ph=Math.max(.12,Math.min(Math.PI-.12,goal.ph));
  drag.x=e.clientX;drag.y=e.clientY;setSpin(false);
});
canvas.addEventListener("pointerup",function(e){if(drag&&drag.m<6)hitTest(e);drag=null;});
canvas.addEventListener("wheel",function(e){e.preventDefault();
  goal.r=Math.max(5,Math.min(80,goal.r*(1+Math.sign(e.deltaY)*.09)));},{passive:false});

var ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function hitTest(e){
  var r=canvas.getBoundingClientRect();
  ndc.x=((e.clientX-r.left)/r.width)*2-1; ndc.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ndc,camera);
  var h=ray.intersectObjects(picks,false);
  select(h.length?h[0].object.userData.key:null);
}

/* ── dots stand in for the legend; the card appears only on demand ── */
var dotHost=document.getElementById("dots"), pop=document.getElementById("pop"), hint=document.getElementById("hint");
var dotEls={}, selected=null, _v=new THREE.Vector3();
ORG.forEach(function(o){
  var b=document.createElement("button");
  b.className="dot"; b.type="button"; b.style.setProperty("--c",o.c);
  b.setAttribute("aria-label",o.n);
  b.addEventListener("click",function(ev){ ev.stopPropagation(); select(o.k===selected?null:o.k); });
  dotHost.appendChild(b); dotEls[o.k]=b;
});
function org(k){for(var i=0;i<ORG.length;i++)if(ORG[i].k===k)return ORG[i];return null;}
function select(k){
  selected=k;
  Object.keys(dotEls).forEach(function(key){ dotEls[key].classList.toggle("sel",key===k); });
  if(!k){ pop.classList.remove("on"); return; }
  var o=org(k); if(!o){ pop.classList.remove("on"); return; }
  var d=""; for(var i=0;i<o.d.length;i++) d+="<dt>"+o.d[i][0]+"</dt><dd>"+o.d[i][1]+"</dd>";
  pop.style.setProperty("--c",o.c);
  pop.innerHTML='<button class="x" type="button" aria-label="Close">&#215;</button>'
    +'<span class="sw"></span><h2>'+o.n+'</h2><div class="lat">'+o.lat+'</div>'
    +'<p>'+o.t+'</p><dl>'+d+'</dl>';
  pop.querySelector(".x").addEventListener("click",function(){select(null);});
  pop.classList.add("on");
  hint.classList.add("gone");
  positionPop();
}

/* Placing the card must not depend on a frame having run: compute it now. */
function positionPop(){
  if(!selected || !anchors[selected]) return;
  var r=canvas.getBoundingClientRect();
  _v.copy(anchors[selected]).project(camera);
  if(_v.z>1) return;
  var x=(_v.x*.5+.5)*r.width, y=(-_v.y*.5+.5)*r.height;
  var pw=pop.offsetWidth||302, ph=pop.offsetHeight||300;
  var left = x < r.width*0.5 ? x+28 : x-pw-28;
  left=Math.max(14,Math.min(Math.max(14,r.width-pw-14),left));
  var top=Math.max(14,Math.min(Math.max(14,r.height-ph-14),y-ph*0.35));
  pop.style.left=left+"px"; pop.style.top=top+"px";
}
document.addEventListener("keydown",function(e){ if(e.key==="Escape") select(null); });

function layout(){
  if(!loaded)return;
  var r=canvas.getBoundingClientRect(), placed=[];
  ORG.forEach(function(o){
    var a=anchors[o.k], el=dotEls[o.k];
    if(!a){el.classList.remove("on");return;}
    _v.copy(a).project(camera);
    if(_v.z>1){el.classList.remove("on");return;}
    placed.push({o:o,el:el,x:(_v.x*.5+.5)*r.width,y:(-_v.y*.5+.5)*r.height});
  });
  placed.sort(function(p,q){return p.y-q.y;});
  for(var i=1;i<placed.length;i++){
    var A=placed[i-1],B=placed[i];
    if(B.y-A.y<17 && Math.abs(B.x-A.x)<17) B.y=A.y+17;
  }
  placed.forEach(function(p){
    p.x=Math.max(12,Math.min(r.width-12,p.x)); p.y=Math.max(12,Math.min(r.height-12,p.y));
    p.el.style.left=p.x+"px"; p.el.style.top=p.y+"px"; p.el.classList.add("on");
    if(p.o.k===selected) positionPop();
  });
}

var sbar=document.getElementById("sbar"), sbarL=document.getElementById("sbarL"), STEPS=[0.5,1,2,5,10];
function scaleBar(){
  var h=canvas.clientHeight;
  var ppu=(h/2)/(cam.r*Math.tan(camera.fov*Math.PI/360));
  var chosen=STEPS[0];
  for(var i=0;i<STEPS.length;i++){chosen=STEPS[i];if(chosen*ppu>=48&&chosen*ppu<=150)break;}
  sbar.style.width=Math.max(20,Math.min(190,Math.round(chosen*ppu)))+"px";
  sbarL.textContent=chosen+" \u00B5m";
}

var bSpin=document.getElementById("bSpin");
function setSpin(v){spin=v;bSpin.setAttribute("aria-pressed",v?"true":"false");}
bSpin.addEventListener("click",function(){setSpin(!spin);});
document.getElementById("bReset").addEventListener("click",function(){
  goal.th=0.86;goal.ph=1.16;select(null);setSpin(true);
});

function resize(){
  var w=figure.clientWidth,h=figure.clientHeight;
  if(!w||!h)return;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener("resize",resize);resize();

var prev=performance.now();
(function tick(now){
  requestAnimationFrame(tick);
  var dt=Math.min(now-prev,64);prev=now;
  if(spin&&!drag&&!selected)goal.th+=dt*0.00006;
  var e=1-Math.pow(0.0025,dt/1000);
  cam.th+=(goal.th-cam.th)*e;cam.ph+=(goal.ph-cam.ph)*e;cam.r+=(goal.r-cam.r)*e;
  place();layout();scaleBar();
  renderer.render(scene,camera);
})(prev);
})();
</script>
</body>
</html>
